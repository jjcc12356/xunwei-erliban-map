name: 发布寻味二里半

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取项目文件
        uses: actions/checkout@v6
      - name: 检查地图脚本与路名避让
        run: |
          node --check public/map/main.js
          node --check public/map/interactions.js
          node --check public/map/map-reading.js
          node --check public/map/route-engine.js
          node --check public/map/route-worker.js
          node --check public/map/route-planner.js
          node --test scripts/*.test.mjs
      - name: 准备静态地图与分享封面
        run: |
          mkdir _site
          cp -R public/map/. _site/
          cp public/og.png _site/og.png
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传静态地图
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
